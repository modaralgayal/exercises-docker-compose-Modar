services: 
  backend: 
    image: modaralgayal/backend
    environment: 
      - REQUEST_ORIGIN=http://localhost:5001
    ports: 
      - 8080:8080
    command: ./server 

  frontend:
    image: modaralgayal/frontend
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080
    ports: 
      - 5001:5001 
    command: serve -s -l 5001 build
    
  
  
    
    